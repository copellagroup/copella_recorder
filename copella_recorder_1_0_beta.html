    <script>

        document.addEventListener('DOMContentLoaded', () => {
            
            // --- WORKER SCRIPT ---
            const WORKER_SCRIPT_STRING = `
                try {
                    self.importScripts('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js');
                } catch (error) {
                    self.postMessage({ type: 'error', message: 'Не удалось загрузить lamejs: ' + error.message });
                    return;
                }

                if (typeof lamejs === 'undefined') {
                    self.postMessage({ type: 'error', message: 'lamejs не загружен' });
                    return;
                }

                self.onmessage = (event) => {
                    const { channels, sampleRate } = event.data;
                    try {
                        const kbps = 128;
                        const mp3encoder = new lamejs.Mp3Encoder(channels.length, sampleRate, kbps);
                        const mp3Data = [];
                        const blockSize = 1152;

                        const pcmInt16 = channels.map(channelData => {
                            const int16Array = new Int16Array(channelData.length);
                            for (let i = 0; i < channelData.length; i++) {
                                int16Array[i] = channelData[i] < 0 ? channelData[i] * 32768 : channelData[i] * 32767;
                            }
                            return int16Array;
                        });
                        
                        const totalSamples = pcmInt16[0].length;
                        let samplesProcessed = 0;
                        for (let i = 0; i < totalSamples; i += blockSize) {
                            const leftChunk = pcmInt16[0].subarray(i, i + blockSize);
                            const rightChunk = pcmInt16.length === 2 ? pcmInt16[1].subarray(i, i + blockSize) : null;
                            const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                            if (mp3buf.length > 0) mp3Data.push(mp3buf);
                            
                            samplesProcessed += blockSize;
                            const progress = Math.min(100, Math.round((samplesProcessed / totalSamples) * 100));
                            if (i % (blockSize * 20) === 0 || (i + blockSize >= totalSamples)) {
                                self.postMessage({ type: 'progress', progress: progress });
                            }
                        }
                        
                        const mp3buf = mp3encoder.flush();
                        if (mp3buf.length > 0) mp3Data.push(mp3buf);
                        const mp3Blob = new Blob(mp3Data, { type: 'audio/mpeg' });
                        
                        self.postMessage({ type: 'complete', mp3Blob: mp3Blob });
                    } catch (error) {
                        self.postMessage({ type: 'error', message: error.message });
                    }
                };
            `;

            // --- CONFIGURATION & STATE ---
            const config = {
                ICONS: {

                    pause: `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`,
                    volumeOn: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>`,
                    volumeOff: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path></svg>`,
                    edit: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path></svg>`,
                    trash: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path></svg>`,
                    dragHandle: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M20 9H4v2h16V9zM4 15h16v-2H4v2z"></path></svg>`,
                    download: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path></svg>`,
                    add: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>`,
                    check: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg>`,
                    confirm: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg>`,
                    copy: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"></path></svg>`,
                },
                STORAGE_KEYS: { stations: 'copellaStations_v1', lastPlayed: 'copellaLastPlayed_v1', welcomeSeen: 'copellaWelcomeSeen_v1', schedules: 'copellaSchedules_v1', volume: 'copellaVolume_v1', recordingFormat: 'copellaRecordingFormat_v1' },
                DB_NAME: 'CopellaDB', DB_VERSION: 2,

            const DEFAULT_STATIONS = [{ name: 'Европа Плюс', url: 'https://hls-01-regions.emgsound.ru/11_msk/playlist.m3u8', icon: 'https://www.radio-city.fm/wp-content/uploads/2017/04/logo-europa-plus.png' }, { name: 'Радио РБК', url: 'https://hls-01-rbc.hostingradio.ru/rbc/playlist.m3u8', icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/RBC_logo_2019.svg/1200px-RBC_logo_2019.svg.png' }];
            const DOM = { playerContent: document.getElementById('player-content'), stationListContainer: document.getElementById('stationListContainer'), audioPlayer: document.getElementById('audioPlayer'), playerPanel: document.getElementById('playerPanel'), visualizer: document.getElementById('visualizer'), stationModal: document.getElementById('stationModal'), welcomeModal: document.getElementById('welcomeModal'), schedulerModal: document.getElementById('schedulerModal'), recordingsModal: document.getElementById('recordingsModal'), settingsModal: document.getElementById('settingsModal'), statsModal: document.getElementById('statsModal'), settingsBtn: document.getElementById('settingsBtn'), mskTime: document.getElementById('mskTime'), emptyStationsView: document.getElementById('empty-stations-view'), stationsHeader: document.getElementById('stationsHeader'), addStationHeaderBtn: document.getElementById('addStationHeaderBtn'), emptyAddBtn: document.getElementById('emptyAddBtn'), stationSearchInput: document.getElementById('stationSearchInput'), stationListMessage: document.getElementById('stationListMessage'), schedulerBtn: document.getElementById('schedulerBtn'), recordingsBtn: document.getElementById('recordingsBtn'), newRecordingBadge: document.getElementById('newRecordingBadge'), apiSearchResults: document.getElementById('apiSearchResults'), apiSearchResultsContainer: document.getElementById('apiSearchResultsContainer'), apiSearchMessage: document.getElementById('apiSearchMessage'), toastContainer: document.getElementById('toastContainer') };
            const state = { hls: new Hls(), mediaRecorder: null, audioChunks: [], stations: [], currentStationIndex: -1, audioContext: null, analyser: null, source: null, animationFrameId: null, recordingInterval: null, recordingStartTime: null, draggedItemIndex: null, scheduledRecordings: [], scheduleCheckInterval: null, db: null, hasNewRecordings: false, nowPlayingTimeout: null, pendingScheduledRecording: null, converterWorker: null, lastVisualizerData: [] };

            // --- DATABASE & STORAGE ---
            const DB = { init() { return new Promise((resolve, reject) => { const request = indexedDB.open(config.DB_NAME, config.DB_VERSION); request.onerror = (event) => reject(`Database error: ${event.target.errorCode}`); request.onsuccess = (event) => { state.db = event.target.result; resolve(); }; request.onupgradeneeded = (event) => { const db = event.target.result; if (!db.objectStoreNames.contains('recordings')) { db.createObjectStore('recordings', { keyPath: 'id' }); } }; }); }, saveRecording(record) { return new Promise((resolve, reject) => { if (!state.db) return reject("Database not initialized."); state.db.transaction(['recordings'], 'readwrite').objectStore('recordings').add(record).onsuccess = resolve; }); }, getRecordings() { return new Promise((resolve) => { state.db.transaction(['recordings'], 'readonly').objectStore('recordings').getAll().onsuccess = (e) => resolve(e.target.result); }); }, getRecording(id) { return new Promise((resolve) => { state.db.transaction(['recordings'], 'readonly').objectStore('recordings').get(id).onsuccess = e => resolve(e.target.result); }); }, deleteRecording(id) { return new Promise((resolve) => { state.db.transaction(['recordings'], 'readwrite').objectStore('recordings').delete(id).onsuccess = resolve; }); } };
            const Storage = { getStations: () => JSON.parse(localStorage.getItem(config.STORAGE_KEYS.stations)) || null, saveStations: () => localStorage.setItem(config.STORAGE_KEYS.stations, JSON.stringify(state.stations)), getLastPlayed: () => localStorage.getItem(config.STORAGE_KEYS.lastPlayed), setLastPlayed: (index) => localStorage.setItem(config.STORAGE_KEYS.lastPlayed, index), clearLastPlayed: () => localStorage.removeItem(config.STORAGE_KEYS.lastPlayed), getSchedules: () => JSON.parse(localStorage.getItem(config.STORAGE_KEYS.schedules)) || [], saveSchedules: () => localStorage.setItem(config.STORAGE_KEYS.schedules, JSON.stringify(state.scheduledRecordings)), getVolume: () => parseFloat(localStorage.getItem(config.STORAGE_KEYS.volume)) || 0.8, saveVolume: (vol) => localStorage.setItem(config.STORAGE_KEYS.volume, vol), getRecordingFormat: () => localStorage.getItem(config.STORAGE_KEYS.recordingFormat) || 'mp3', saveRecordingFormat: (format) => localStorage.setItem(config.STORAGE_KEYS.recordingFormat, format) };

            // --- UI & FEEDBACK ---
            const hapticFeedback = () => { if ('vibrate' in navigator) navigator.vibrate(8); };
            function showToast(message, type = 'info', duration = 3000) { const colors = { info: 'bg-accent-purple', success: 'bg-accent-green', error: 'bg-error', warning: 'bg-warning' }; const toast = document.createElement('div'); toast.className = `toast p-3 rounded-medium text-center text-sm font-semibold shadow-lg text-bg-color ${colors[type]} animate-fade-in-up`; toast.textContent = message; DOM.toastContainer.appendChild(toast); setTimeout(() => { toast.classList.remove('animate-fade-in-up'); toast.classList.add('animate-fade-out-down'); setTimeout(() => toast.remove(), 300); }, duration); }
            function createPlaceholder(name, extraClasses = []) { const initial = (name ? name.trim().charAt(0) : '?').toUpperCase(); let hash = 0; for (let i = 0; i < (name || "").length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash); const color = `hsl(${hash % 360}, 50%, 30%)`; return `<div class="${['w-full h-full flex items-center justify-center font-bold', ...extraClasses].join(' ')}" style="background-color:${color};">${initial}</div>`; }

            // --- RECORDING & CONVERSION ---
            function toggleRecording() { if (state.currentStationIndex === -1 || DOM.audioPlayer.paused) { showToast('Начните воспроизведение для записи.', 'warning'); return; } if (state.mediaRecorder?.state === 'recording') { state.mediaRecorder.stop(); clearInterval(state.recordingInterval); state.recordingInterval = null; } else { startRecording(); } }

            function showConversionProgress(show) { const container = document.getElementById('conversion-progress-container'), nowPlaying = document.getElementById('player-now-playing'); if (!container || !nowPlaying) return; if (show) { container.classList.remove('hidden'); nowPlaying.classList.add('hidden'); } else { container.classList.add('hidden'); nowPlaying.classList.remove('hidden'); document.getElementById('conversion-progress-bar').style.width = '0%'; document.getElementById('conversion-status-text').textContent = 'Обработка...'; } }
            async function processRecording() {
                if (state.audioChunks.length === 0) { showToast("Запись не удалась. Файл пуст.", 'error'); resetRecordingUI(); return; }
                const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                const durationInSeconds = Math.round((Date.now() - state.recordingStartTime) / 1000);
                const station = state.stations[state.currentStationIndex];
                resetRecordingUI();
                
                // Если формат WebM или браузер не поддерживает декодирование, сохраняем как есть
                if (Storage.getRecordingFormat() === 'webm' || !canDecodeAudio()) {
                    const recordData = { id: Date.now(), stationName: station.name, stationIcon: station.icon, date: new Date().toISOString(), duration: durationInSeconds, blob: audioBlob };
                    await DB.saveRecording(recordData);
                    state.hasNewRecordings = true;
                    updateNewRecordingBadge();
                    const format = Storage.getRecordingFormat() === 'webm' ? 'WebM' : 'WebM (MP3 недоступен)';
                    showToast(`Запись ${format} сохранена!`, 'success');
                    return;
                }

                // Попытка конвертации в MP3
                showConversionProgress(true); 
                document.getElementById('conversion-status-text').textContent = 'Декодирование...';
                
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const arrayBuffer = await audioBlob.arrayBuffer();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    const channelsData = []; const transferable = [];
                    for (let i = 0; i < audioBuffer.numberOfChannels; i++) { 
                        const channel = audioBuffer.getChannelData(i); 
                        channelsData.push(channel); 
                        transferable.push(channel.buffer); 
                    }
                    if (durationInSeconds > 60 * 10) { 
                        showToast("Началась обработка длинной записи. Это может занять несколько минут.", "info", 5000); 
                    }
                    if (state.converterWorker) state.converterWorker.terminate();
                    const workerBlob = new Blob([WORKER_SCRIPT_STRING], { type: 'application/javascript' });
                    state.converterWorker = new Worker(URL.createObjectURL(workerBlob));
                    state.converterWorker.onmessage = async (event) => {
                        const { type, progress, mp3Blob, message } = event.data;
                        if (type === 'progress') { 
                            document.getElementById('conversion-progress-bar').style.width = `${progress}%`; 
                            document.getElementById('conversion-status-text').textContent = `Кодирование... ${progress}%`; 
                        } else if (type === 'complete') {
                            const recordData = { id: Date.now(), stationName: station.name, stationIcon: station.icon, date: new Date().toISOString(), duration: durationInSeconds, blob: mp3Blob };
                            await DB.saveRecording(recordData); 
                            state.hasNewRecordings = true; 
                            updateNewRecordingBadge(); 
                            showToast('Запись MP3 сохранена!', 'success');
                            showConversionProgress(false); 
                            state.converterWorker.terminate(); 
                            state.converterWorker = null;
                        } else if (type === 'error') { 
                            throw new Error(message); 
                        }
                    };
                    state.converterWorker.onerror = (err) => { 
                        console.error('Worker error:', err);
                        showToast('Ошибка конвертации: ' + (err.message || 'Неизвестная ошибка'), 'error');
                        showConversionProgress(false);
                        if (state.converterWorker) {
                            state.converterWorker.terminate();
                            state.converterWorker = null;
                        }
                    };
                    state.converterWorker.postMessage({ channels: channelsData, sampleRate: audioBuffer.sampleRate }, transferable);
                } catch(error) {
                    console.error('Ошибка обработки записи:', error); 
                    showToast('Не удалось декодировать запись. Сохраняем в формате WebM.', 'warning', 5000); 
                    showConversionProgress(false);
                    // Fallback: сохраняем как WebM
                    const recordData = { id: Date.now(), stationName: station.name, stationIcon: station.icon, date: new Date().toISOString(), duration: durationInSeconds, blob: audioBlob };
                    await DB.saveRecording(recordData);
                    state.hasNewRecordings = true;
                    updateNewRecordingBadge();
                    showToast('Запись WebM сохранена!', 'success');
                    if (state.converterWorker) { 
                        state.converterWorker.terminate(); 
                        state.converterWorker = null; 
                    }
                }
            }

            function drawVisualizer() { const ctx = DOM.visualizer.getContext('2d'), dataArray = new Uint8Array(state.analyser.frequencyBinCount); state.animationFrameId = requestAnimationFrame(drawVisualizer); if (!state.analyser || DOM.audioPlayer.paused) { ctx.clearRect(0, 0, DOM.visualizer.width, DOM.visualizer.height); return; } state.analyser.getByteFrequencyData(dataArray); const { width, height } = ctx.canvas; ctx.clearRect(0, 0, width, height); const barWidth = (width / dataArray.length) * 1.5; let x = 0; const isRecording = state.isRecording || false; const barColor = isRecording ? 'rgba(255, 69, 58, 0.8)' : 'rgba(255, 255, 255, 0.05)'; ctx.fillStyle = barColor; for (let i = 0; i < dataArray.length; i++) { const newHeight = (dataArray[i] / 255) * height * 0.7; const oldHeight = state.lastVisualizerData[i] || 0; const smoothedHeight = oldHeight * 0.9 + newHeight * 0.1; state.lastVisualizerData[i] = smoothedHeight; if (smoothedHeight < 2) continue; ctx.fillRect(x, height - smoothedHeight, barWidth, smoothedHeight); x += barWidth + 2; } }
            
            // --- PROFESSIONAL FUNCTIONS ---
            function analyzeStreamQuality() {
                if (!state.analyser) return null;
                const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                state.analyser.getByteFrequencyData(dataArray);
                let total = 0, peaks = 0, silence = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    total += dataArray[i];
                    if (dataArray[i] > 200) peaks++;
                    if (dataArray[i] < 10) silence++;
                }
                const average = total / dataArray.length;
                let quality = 'unknown';
                if (average > 100 && peaks > 10) quality = 'excellent';
                else if (average > 50 && peaks > 5) quality = 'good';
                else if (average > 20 && peaks > 2) quality = 'fair';
                else if (average > 5) quality = 'poor';
                else quality = 'silent';
                return { quality, average: Math.round(average), peaks, silence, bitrate: estimateBitrate() };
            }
            function estimateBitrate() {
                if (!DOM.audioPlayer.src) return 'unknown';
                const url = DOM.audioPlayer.src.toLowerCase();
                if (url.includes('128')) return '128 kbps';
                if (url.includes('192')) return '192 kbps';
                if (url.includes('256')) return '256 kbps';
                if (url.includes('320')) return '320 kbps';
                if (url.includes('64')) return '64 kbps';
                if (url.includes('96')) return '96 kbps';
                return 'unknown';
            }
            function analyzeStreamMetadata() {
                const station = state.stations[state.currentStationIndex];
                if (!station) return null;
                return {
                    stationName: station.name,
                    url: station.url,
                    protocol: detectProtocol(station.url),
                    format: detectFormat(station.url),
                    server: extractServer(station.url),
                    port: extractPort(station.url),
                    path: extractPath(station.url)
                };
            }
            function detectProtocol(url) {
                if (url.includes('https://')) return 'HTTPS';
                if (url.includes('http://')) return 'HTTP';
                if (url.includes('rtmp://')) return 'RTMP';
                if (url.includes('rtsp://')) return 'RTSP';
                if (url.includes('udp://')) return 'UDP';
                return 'Unknown';
            }
            function detectFormat(url) {
                if (url.includes('.m3u8')) return 'HLS';
                if (url.includes('.m3u')) return 'M3U';
                if (url.includes('.pls')) return 'PLS';
                if (url.includes('.asx')) return 'ASX';
                if (url.includes('.wax')) return 'WAX';
                if (url.includes('.wvx')) return 'WVX';
                if (url.includes('.mp3')) return 'MP3';
                if (url.includes('.aac')) return 'AAC';
                if (url.includes('.ogg')) return 'OGG';
                return 'Unknown';
            }
            function extractServer(url) {
                try {
                    const urlObj = new URL(url);
                    return urlObj.hostname;
                } catch (e) {
                    return 'unknown';
                }
            }
            function extractPort(url) {
                try {
                    const urlObj = new URL(url);
                    return urlObj.port || (urlObj.protocol === 'https:' ? '443' : '80');
                } catch (e) {
                    return 'unknown';
                }
            }
            function extractPath(url) {
                try {
                    const urlObj = new URL(url);
                    return urlObj.pathname;
                } catch (e) {
                    return 'unknown';
                }
            }
            function analyzeVolume() {
                if (!state.analyser) return null;
                const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                state.analyser.getByteFrequencyData(dataArray);
                let total = 0, peak = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    total += dataArray[i];
                    if (dataArray[i] > peak) peak = dataArray[i];
                }
                const average = total / dataArray.length;
                const volume = Math.round((average / 255) * 100);
                const peakVolume = Math.round((peak / 255) * 100);
                return { average: volume, peak: peakVolume, level: getVolumeLevel(volume) };
            }
            function getVolumeLevel(volume) {
                if (volume > 80) return 'very_loud';
                if (volume > 60) return 'loud';
                if (volume > 40) return 'moderate';
                if (volume > 20) return 'quiet';
                if (volume > 5) return 'very_quiet';
                return 'silent';
            }
            function checkStreamStability() {
                if (!state.analyser) return null;
                const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                state.analyser.getByteFrequencyData(dataArray);
                let total = 0, variance = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    total += dataArray[i];
                }
                const average = total / dataArray.length;
                for (let i = 0; i < dataArray.length; i++) {
                    variance += Math.pow(dataArray[i] - average, 2);
                }
                variance = variance / dataArray.length;
                const stability = Math.round(100 - (Math.sqrt(variance) / average * 100));
                return { stability: Math.max(0, stability), variance: Math.round(variance), average: Math.round(average) };
            }
            function generateQualityReport() {
                const quality = analyzeStreamQuality();
                const metadata = analyzeStreamMetadata();
                const volume = analyzeVolume();
                const stability = checkStreamStability();
                let report = '=== ОТЧЕТ О КАЧЕСТВЕ ПОТОКА ===\n\n';
                report += 'Станция: ' + (metadata ? metadata.stationName : 'Неизвестно') + '\n';
                report += 'Протокол: ' + (metadata ? metadata.protocol : 'Неизвестно') + '\n';
                report += 'Формат: ' + (metadata ? metadata.format : 'Неизвестно') + '\n';
                report += 'Сервер: ' + (metadata ? metadata.server : 'Неизвестно') + '\n';
                report += 'Порт: ' + (metadata ? metadata.port : 'Неизвестно') + '\n\n';
                report += '=== АНАЛИЗ КАЧЕСТВА ===\n';
                report += 'Общее качество: ' + (quality ? quality.quality : 'Неизвестно') + '\n';
                report += 'Средний уровень: ' + (quality ? quality.average : 'Неизвестно') + '\n';
                report += 'Пики: ' + (quality ? quality.peaks : 'Неизвестно') + '\n';
                report += 'Тишина: ' + (quality ? quality.silence : 'Неизвестно') + '\n';
                report += 'Битрейт: ' + (quality ? quality.bitrate : 'Неизвестно') + '\n\n';
                report += '=== АНАЛИЗ ГРОМКОСТИ ===\n';
                report += 'Средняя громкость: ' + (volume ? volume.average + '%' : 'Неизвестно') + '\n';
                report += 'Пиковая громкость: ' + (volume ? volume.peak + '%' : 'Неизвестно') + '\n';
                report += 'Уровень: ' + (volume ? volume.level : 'Неизвестно') + '\n\n';
                report += '=== СТАБИЛЬНОСТЬ ===\n';
                report += 'Стабильность: ' + (stability ? stability.stability + '%' : 'Неизвестно') + '\n';
                report += 'Вариация: ' + (stability ? stability.variance : 'Неизвестно') + '\n';
                report += 'Среднее значение: ' + (stability ? stability.average : 'Неизвестно') + '\n\n';
                report += 'Время генерации: ' + new Date().toLocaleString() + '\n';
                return report;
            }
            function showTechnicalInfo() {
                const report = generateQualityReport();
                const content = `<div class="modal-content bg-panel-bg p-6 rounded-large w-full max-w-2xl transform scale-95 transition-transform duration-300 flex flex-col"><div class="flex justify-between items-center mb-6 flex-shrink-0"><h2 class="text-xl font-bold">Техническая информация</h2><button class="close-btn text-2xl text-text-secondary">&times;</button></div><div class="flex-grow overflow-y-auto"><pre class="text-sm text-text-primary whitespace-pre-wrap bg-zinc-800 p-4 rounded-medium">${report}</pre></div><div class="flex gap-3 mt-4 flex-shrink-0"><button id="exportTechDataBtn" class="flex-1 p-3 text-base font-bold rounded-small border border-border-color bg-zinc-800 text-text-primary cursor-pointer">Экспорт данных</button><button id="copyReportBtn" class="flex-1 p-3 text-base font-bold rounded-small border border-border-color bg-zinc-800 text-text-primary cursor-pointer">Копировать отчет</button></div></div>`;
                openGenericModal(DOM.statsModal, content);
                DOM.statsModal.querySelector('.close-btn').onclick = () => closeModal(DOM.statsModal);
                DOM.statsModal.querySelector('#exportTechDataBtn').onclick = exportTechnicalData;
                DOM.statsModal.querySelector('#copyReportBtn').onclick = () => {
                    navigator.clipboard.writeText(report).then(() => {
                        showToast('Отчет скопирован в буфер обмена!', 'success');
                    });

            }
            function exportTechnicalData() {
                const data = {
                    timestamp: new Date().toISOString(),

                a.href = url;
                a.download = 'copella-technical-data-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);

            }
            
            // --- RECORDING PLAYER FUNCTIONS ---
            let recordingPlayer = null;
            let currentRecording = null;
            
            function setupRecordingPlayer() {
                recordingPlayer = document.createElement('audio');
                recordingPlayer.preload = 'metadata';
                
                const playBtn = document.getElementById('recordingPlayBtn');
                const volumeBtn = document.getElementById('recordingVolumeBtn');
                
                if (playBtn) {
                    playBtn.onclick = () => toggleRecordingPlayback();
                }
                
                if (volumeBtn) {
                    volumeBtn.onclick = () => { 
                        recordingPlayer.muted = !recordingPlayer.muted; 
                        updateRecordingVolumeUI(); 
                    };
                }
                
                recordingPlayer.addEventListener('timeupdate', updateRecordingProgress);
                recordingPlayer.addEventListener('loadedmetadata', () => updateRecordingDuration());
                recordingPlayer.addEventListener('ended', () => stopRecordingPlayback());
            }
            
            function playRecording(id) {
                DB.getRecording(id).then(rec => {
                    if (!rec) return;
                    
                    stopRecordingPlayback();
                    currentRecording = rec;
                    
                    const url = URL.createObjectURL(rec.blob);
                    recordingPlayer.src = url;
                    
                    // Обновляем UI плеера
                    const artEl = document.getElementById('recordingArt');
                    const titleEl = document.getElementById('recordingTitle');
                    const infoEl = document.getElementById('recordingInfo');
                    const playerEl = document.getElementById('recordingPlayer');
                    
                    if (artEl) {
                        artEl.innerHTML = rec.stationIcon ? `<img src="${rec.stationIcon}" class="w-full h-full object-cover">` : createPlaceholder(rec.stationName, ['text-lg']);
                    }
                    
                    if (titleEl) {
                        titleEl.textContent = rec.stationName;
                    }
                    
                    if (infoEl) {
                        const date = new Date(rec.date);
                        const minutes = Math.floor(rec.duration / 60);
                        const seconds = rec.duration % 60;
                        const fileExtension = rec.blob.type && rec.blob.type.includes('mpeg') ? 'mp3' : 'webm';
                        infoEl.textContent = `${date.toLocaleDateString()} • ${minutes}м ${seconds}с • ${fileExtension.toUpperCase()}`;
                    }
                    
                    if (playerEl) {
                        playerEl.classList.remove('hidden');
                    }
                    
                    recordingPlayer.play().catch(err => {
                        console.error('Ошибка воспроизведения записи:', err);
                        showToast('Не удалось воспроизвести запись', 'error');
                    });
                });
            }
            
            function toggleRecordingPlayback() {
                if (!recordingPlayer || !currentRecording) return;
                
                if (recordingPlayer.paused) {
                    recordingPlayer.play().catch(err => {
                        console.error('Ошибка воспроизведения:', err);
                        showToast('Ошибка воспроизведения записи', 'error');
                    });
                } else {
                    recordingPlayer.pause();
                }
            }
            
            function stopRecordingPlayback() {
                if (recordingPlayer) {
                    recordingPlayer.pause();
                    recordingPlayer.currentTime = 0;
                    recordingPlayer.src = '';
                }
                
                updateRecordingPlayButton();
                updateRecordingProgress();
                
                const playerEl = document.getElementById('recordingPlayer');
                if (playerEl) {
                    playerEl.classList.add('hidden');
                }
                
                currentRecording = null;
            }
            
            function updateRecordingProgress() {
                if (!recordingPlayer) return;
                
                const progressEl = document.getElementById('recordingProgress');
                const currentTimeEl = document.getElementById('recordingCurrentTime');
                
                if (progressEl && recordingPlayer.duration) {
                    const progress = (recordingPlayer.currentTime / recordingPlayer.duration) * 100;
                    progressEl.style.width = `${progress}%`;
                }
                
                if (currentTimeEl) {
                    currentTimeEl.textContent = formatTime(recordingPlayer.currentTime);
                }
                
                updateRecordingPlayButton();
            }
            
            function updateRecordingDuration() {
                const durationEl = document.getElementById('recordingDuration');
                if (durationEl && recordingPlayer.duration) {
                    durationEl.textContent = formatTime(recordingPlayer.duration);
                }
            }
            
            function updateRecordingPlayButton() {
                const playBtn = document.getElementById('recordingPlayBtn');
                if (!playBtn) return;
                
                const icon = recordingPlayer && !recordingPlayer.paused ? 
                    '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>' :
                    '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
                
                playBtn.innerHTML = icon;
            }
            
            function updateRecordingVolumeUI() {
                const volumeBtn = document.getElementById('recordingVolumeBtn');
                if (!volumeBtn || !recordingPlayer) return;
                
                const icon = recordingPlayer.muted ? 
                    '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path></svg>' :
                    '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>';
                
                volumeBtn.innerHTML = icon;
            }
            
            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            
            // --- BATCH OPERATIONS ---
            function setupBatchOperations() {
                const selectAllBtn = document.getElementById('selectAllBtn');
                const batchDeleteBtn = document.getElementById('batchDeleteBtn');
                
                if (selectAllBtn) {
                    selectAllBtn.onclick = () => toggleSelectAll();
                }
                
                if (batchDeleteBtn) {
                    batchDeleteBtn.onclick = () => batchDeleteRecordings();
                }
                
                // Обработчики для кастомных чекбоксов
                setTimeout(() => {
                    document.querySelectorAll('.custom-checkbox').forEach(checkbox => {
                        checkbox.onclick = () => {
                            const dot = checkbox.querySelector('div');
                            const isChecked = !dot.classList.contains('hidden');
                            if (isChecked) {
                                dot.classList.add('hidden');
                                checkbox.classList.remove('border-accent');
                            } else {
                                dot.classList.remove('hidden');
                                checkbox.classList.add('border-accent');
                            }
                            updateBatchButtons();
                        };
                    });
                }, 100);
            }
            
            function toggleSelectAll() {
                const checkboxes = document.querySelectorAll('.custom-checkbox');
                const selectAllBtn = document.getElementById('selectAllBtn');
                const allChecked = Array.from(checkboxes).every(cb => {
                    const dot = cb.querySelector('div');
                    return !dot.classList.contains('hidden');
                });
                
                checkboxes.forEach(checkbox => {
                    const dot = checkbox.querySelector('div');
                    if (allChecked) {
                        dot.classList.add('hidden');
                        checkbox.classList.remove('border-accent');
                    } else {
                        dot.classList.remove('hidden');
                        checkbox.classList.add('border-accent');
                    }
                });
                
                if (selectAllBtn) {
                    selectAllBtn.textContent = allChecked ? 'Выбрать все' : 'Снять все';
                }
                
                updateBatchButtons();
            }
            
            function updateBatchButtons() {
                const checkboxes = document.querySelectorAll('.custom-checkbox');
                const checkedCount = Array.from(checkboxes).filter(cb => {
                    const dot = cb.querySelector('div');
                    return !dot.classList.contains('hidden');
                }).length;
                const batchDeleteBtn = document.getElementById('batchDeleteBtn');
                
                if (batchDeleteBtn) {
                    if (checkedCount > 0) {
                        batchDeleteBtn.classList.remove('hidden');
                        batchDeleteBtn.textContent = `Удалить выбранные (${checkedCount})`;
                    } else {
                        batchDeleteBtn.classList.add('hidden');
                    }
                }
            }
            
            function batchDeleteRecordings() {
                const checkboxes = Array.from(document.querySelectorAll('.custom-checkbox')).filter(cb => {
                    const dot = cb.querySelector('div');
                    return !dot.classList.contains('hidden');
                });
                if (checkboxes.length === 0) return;
                
                const confirmMsg = `Вы уверены, что хотите удалить ${checkboxes.length} записей?`;
                if (!confirm(confirmMsg)) return;
                
                const deletePromises = checkboxes.map(checkbox => {
                    const id = parseInt(checkbox.dataset.id);
                    return DB.deleteRecording(id);
                });
                
                Promise.all(deletePromises).then(() => {
                    renderRecordingsList();
                    setupBatchOperations();
                    showToast('Записи удалены', 'success');
                }).catch(err => {
                    console.error('Ошибка массового удаления:', err);
                    showToast('Ошибка при удалении записей', 'error');
                });
            }
            
            // --- INITIALIZATION ---
            async function init() { try { await DB.init(); } catch (err) { console.error("Failed to init DB. Recordings will not be saved.", err); showToast('Хранилище записей не инициализировано. Записи не будут сохраняться.', 'error', 5000); } state.stations = Storage.getStations() || DEFAULT_STATIONS; if(Storage.getStations() === null) Storage.saveStations(); state.scheduledRecordings = Storage.getSchedules(); DOM.audioPlayer.volume = Storage.getVolume(); renderPlayer(null); renderStationsList(); updateMskTime(); setInterval(updateMskTime, 5000); state.scheduleCheckInterval = setInterval(checkSchedules, 5000); DOM.addStationHeaderBtn.onclick = () => { hapticFeedback(); openStationModal(); }; DOM.emptyAddBtn.onclick = () => { hapticFeedback(); openStationModal(); }; DOM.stationSearchInput.oninput = (e) => handleSearch(e.target.value); DOM.schedulerBtn.onclick = () => { hapticFeedback(); openSchedulerModal(); }; DOM.recordingsBtn.onclick = () => { hapticFeedback(); openRecordingsModal(); }; DOM.settingsBtn.onclick = () => { hapticFeedback(); openSettingsModal(); }; window.addEventListener('resize', resizeCanvas); DOM.audioPlayer.onplay = () => { updatePlayPauseIcon(); setupVisualizer(); DOM.playerPanel.classList.remove('loading', 'error'); document.querySelectorAll('.station-list-item.active .playing-indicator').forEach(el => el.classList.add('hidden')); const activeItem = document.querySelector(`.station-list-item[data-index='${state.currentStationIndex}']`); if (activeItem) activeItem.querySelector('.playing-indicator')?.classList.remove('hidden'); if (state.pendingScheduledRecording) { const schedule = state.pendingScheduledRecording; schedule.status = 'recording'; toggleRecording(); setTimeout(() => { if (state.mediaRecorder?.state === 'recording') toggleRecording(); schedule.status = 'finished'; Storage.saveSchedules(); if (!DOM.schedulerModal.classList.contains('opacity-0')) renderScheduleList(); }, schedule.duration * 60 * 1000); Storage.saveSchedules(); if (!DOM.schedulerModal.classList.contains('opacity-0')) renderScheduleList(); state.pendingScheduledRecording = null; } }; DOM.audioPlayer.onpause = () => { updatePlayPauseIcon(); DOM.playerPanel.classList.remove('loading'); document.querySelectorAll('.playing-indicator').forEach(item => item.classList.add('hidden')); }; DOM.audioPlayer.onvolumechange = updateVolumeUI; DOM.audioPlayer.onerror = () => { DOM.playerPanel.classList.remove('loading'); DOM.playerPanel.classList.add('error'); updateNowPlayingUI('Ошибка потока'); }; if (!localStorage.getItem(config.STORAGE_KEYS.welcomeSeen)) setTimeout(openWelcomeModal, 500); }
            init();
        });
